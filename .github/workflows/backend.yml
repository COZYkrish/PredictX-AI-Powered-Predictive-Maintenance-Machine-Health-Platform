name: Backend CI

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: predictx
          POSTGRES_PASSWORD: password
          POSTGRES_DB: predictx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio pip-audit
        
    - name: Security Audit
      run: pip-audit
      continue-on-error: true
        
    - name: Run Tests
      env:
        DATABASE_URL: postgresql://predictx:password@localhost:5432/predictx_test
      run: |
        pytest tests/unit/ tests/integration/
        
    - name: ML Model Validation
      run: |
        python -m ml.dataset_info || echo "No dataset to check"
        python scripts/verify_model.py || echo "No models to check"
